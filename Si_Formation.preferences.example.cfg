# si_formation settings | UserData/Formations_cfg/si_formation.cfg
# Edit while the server is stopped. Commands marked "match-only" do not save.
# /formation help lists commands for your current role and permissions.
[Si_Formation]

# === General ===
# /formation on|off | Admin | Master switch for this match.
Enabled = true
# Bounded diagnostic logging; normally leave disabled.
Debug = false

# === Capacity ===
# /formationsizeglobal <1..50> | Admin | FPS squad size INCLUDING its leader; match-only.
# /formationsize "Player Name" <1..50> | Admin | One player's FPS limit; match-only.
GroupLimit = 10
# /formationsizecommander <1..100> | Admin | Saved ground-unit cap per move; default 75.
# Aircraft and excess units move normally instead of cancelling the formation.
CommanderOrderLimit = 75

# === Starting formations ===
# Exact menu numbers: 1 = vanilla; 2..9999 = custom formation.
# Applied each round and on fresh team/role state. Missing options fall back to 1.
# Commanders follow the master switch; there is no personal on/off command.
# Sol
DefaultSolMove = 1
DefaultSolFollow = 1
DefaultSolAttack = 1
DefaultSolCommander = 1

# Centauri
DefaultCentauriMove = 1
DefaultCentauriFollow = 1
DefaultCentauriAttack = 1
DefaultCentauriCommander = 1

# Alien
DefaultAlienMove = 1
DefaultAlienFollow = 1
DefaultAlienAttack = 1
DefaultAlienCommander = 1

# === Soft-lock departures ===
# /startdelaysoftlock <seconds> | Admin | Match-only; default 0.2.
# Seconds between front-first 20-percent batches (at most five starts).
# All departure delays: 0 disables; otherwise 0.1..5 seconds.
StartDelaySoftLock = 0.2

# === Explicit /formation lock ===
# /Formationtraveldistance <0..10000> | Admin | Saved maximum in metres; default 1000.
# Measured horizontally from selected ground units' centre to the clicked destination.
# Farther clicks stop the locked formation's centre at this distance.
# 0 keeps its centre in place; it does NOT mean unlimited. Soft locks are unaffected.
FormationTravelDistance = 1000
# /startdelayspeedlock <seconds> | Admin | Slowest TopSpeed tier first; match-only.
# Takes priority over positional rows when positive; default 0.3.
StartDelaySpeedLock = 0.3
# /startdelaylock <seconds> or /startdelay lock <seconds> | Admin | Match-only.
# Positional rows apply only when speed-tier delay is zero; default 0.
StartDelayLock = 0
# /Formationspeedcap on|off | Admin | Optional faster-unit ceiling near arrival.
# Command is match-only. Centre-based travel pacing remains active either way.
FormationSpeedCap = true

# === Legacy compatibility (currently inactive) ===
# /formationTolerance <10..100> and /FormationFallof <10..90>.
# Retained for compatibility; these values do not affect current movement.
FormationPositionTolerance = 25
FormationFalloffSlowdown = 25
