# Standalone file: UserData/Formations_cfg/si_formation.cfg (2.6.1).
# Install.ps1 migrates only this category and preserves existing values.
[Si_Formation]
Enabled = true
# FPS total INCLUDING controlled leader; range 1..50.
GroupLimit = 10
# Commander formation capacity only; range 1..100. Oversized orders remain native.
CommanderOrderLimit = 75
Debug = false
# Initial menu options: 1=native; 2..9999=exact option in that team/function menu.
# Custom defaults enable personal formations; 1 leaves only that function native.
DefaultSolMove = 1
DefaultSolFollow = 1
DefaultSolAttack = 1
DefaultSolCommander = 1
DefaultCentauriMove = 1
DefaultCentauriFollow = 1
DefaultCentauriAttack = 1
DefaultCentauriCommander = 1
DefaultAlienMove = 1
DefaultAlienFollow = 1
DefaultAlienAttack = 1
DefaultAlienCommander = 1

# Seconds between soft 20-percent batches (at most five starts), or explicit-lock rows: 0 disables, otherwise 0.1..5.
StartDelaySoftLock = 0.2
StartDelayLock = 0
StartDelaySpeedLock = 0.3
FormationSpeedCap = true
FormationTravelDistance = 750
FormationPositionTolerance = 25
FormationFalloffSlowdown = 25
